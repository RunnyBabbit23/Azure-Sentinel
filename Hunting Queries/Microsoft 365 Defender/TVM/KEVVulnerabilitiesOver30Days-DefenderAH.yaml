  let OldKEVs = KEVData
      | where DateAdded < ago(LookbackDays)
      | extend DaysInKEV = datetime_diff('day', now(), DateAdded);
  DeviceTvmSoftwareVulnerabilities
  | join kind=inner OldKEVs on $left.CveId == $right.CveID
  | extend RansomwareRisk = iff(RansomwareCampaign =~ "Known", "High", "Standard")
  | project
      DeviceName,
      CveId,
      VulnerabilityName,
      VendorProject,
      Product,
      SoftwareName,
      SoftwareVersion,
      OSPlatform,
      DateAdded,
      DaysInKEV,
      RansomwareCampaign,
      RansomwareRisk,
      RecommendedSecurityUpdate
  | order by RansomwareRisk asc, DaysInKEV desc
