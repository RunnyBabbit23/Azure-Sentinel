id: 0f92242d-811c-4c3a-a0c4-1e7488241355
name: KEV - Unpatched Known Exploited Vulnerabilities Older Than 30 Days (Defender Advanced Hunting)
description: |
  Identifies devices with unpatched CVEs from the CISA Known Exploited Vulnerabilities (KEV) catalog
  where the vulnerability was added to the catalog more than 30 days ago. This query is optimized for
  Microsoft Defender Advanced Hunting and embeds the KEV catalog directly as a KQL datatable,
  covering all entries added from January 2024 through January 29, 2026 (30 days before the catalog
  snapshot date). For entries prior to 2024, use the Sentinel Watchlist variant of this query.

  The KEV catalog (https://www.cisa.gov/known-exploited-vulnerabilities-catalog) contains CVEs
  confirmed as actively exploited in the wild. Under CISA BOD 22-01, federal agencies must remediate
  KEV entries within defined windows. A 30-day threshold is a widely accepted remediation benchmark
  for any organization. Results include a RansomwareRisk flag for the highest-priority entries.

  Note: This datatable was generated from the CISA KEV catalog on 2026-03-01. Re-generate
  periodically to include newly added KEV entries. The catalog snapshot covers 448 CVEs.

  Recommended Action: Prioritize patching ordered by DaysUnremediated. Focus immediately on entries
  where RansomwareRisk = "High". Cross-reference with internet-exposed and privileged-access devices.
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceTvmSoftwareVulnerabilities
tactics:
  - InitialAccess
  - Execution
  - PrivilegeEscalation
relevantTechniques:
  - T1190
  - T1203
  - T1068
