  DeviceTvmSoftwareVulnerabilities
  | join kind=inner OldRansomwareKEVs on $left.CveId == $right.CveID
  | join kind=leftouter VulnKB on CveId
  | extend DaysInKEV = datetime_diff('day', now(), DateAdded)
  | summarize
      VulnCount       = dcount(CveId),
      CVEs            = make_set(CveId, 50),
      MaxDaysUnpatch  = max(DaysInKEV),
      MaxCvssScore    = max(CvssScore),
      CriticalVulns   = countif(VulnerabilitySeverityLevel =~ "Critical"),
      HighVulns       = countif(VulnerabilitySeverityLevel =~ "High"),
      AffectedVendors = make_set(VendorProject, 20)
      by DeviceName, OSPlatform
  | extend RiskScore = round(MaxCvssScore * log(MaxDaysUnpatch + 1), 2)
  | project
      DeviceName,
      OSPlatform,
      VulnCount,
      CriticalVulns,
      HighVulns,
      MaxCvssScore,
      MaxDaysUnpatch,
      RiskScore,
      AffectedVendors,
      CVEs
  | order by RiskScore desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
version: 1.0.0
metadata:
  source:
    kind: Community
  author:
