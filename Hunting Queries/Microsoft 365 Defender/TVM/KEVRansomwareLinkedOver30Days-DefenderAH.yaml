id: 696e252f-856a-4da4-b94c-8b613f2ac0a4
name: KEV - Ransomware-Associated Known Exploited Vulnerabilities Older Than 30 Days (Defender Advanced Hunting)
description: |
  Identifies devices with unpatched CVEs that CISA has explicitly flagged in the KEV catalog as
  actively used in ransomware campaigns (knownRansomwareCampaignUse = "Known") AND where the
  vulnerability has been in the KEV catalog for more than 30 days. This is the highest-priority
  subset of the KEV catalog — these vulnerabilities are confirmed tools of active ransomware threat
  actors. Unpatched presence after 30 days represents critical organizational risk.

  This query is optimized for Microsoft Defender Advanced Hunting and embeds all 310 ransomware-
  associated KEV entries (2021 through January 29, 2026) directly as a KQL datatable. It enriches
  results with CVSS scores from DeviceTvmSoftwareVulnerabilitiesKB and computes a RiskScore
  (CVSS × log(DaysUnremediated)) to surface the worst device/CVE combinations first.

  Note: This datatable was generated from the CISA KEV catalog on 2026-03-01. Re-generate
  periodically. The catalog snapshot covers 310 ransomware-associated CVEs across all years.

  Recommended Action: Treat all results as critical. Escalate immediately to the patching team.
  Investigate whether any exploitation activity has already occurred via process and network hunting.
  Consider isolating the highest-scoring devices pending emergency patching.
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceTvmSoftwareVulnerabilities
      - DeviceTvmSoftwareVulnerabilitiesKB
tactics:
  - InitialAccess
  - Impact
relevantTechniques:
  - T1190
  - T1486
