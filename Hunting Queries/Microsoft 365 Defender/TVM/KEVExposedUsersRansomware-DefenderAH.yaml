id: e6816221-07af-45c2-b31d-63cd75624ac0
name: KEV - Active Users on Devices with Ransomware-Linked KEVs Older Than 30 Days (Defender Advanced Hunting)
description: |
  Correlates ransomware-associated CISA KEV entries (older than 30 days) against devices in
  Microsoft Defender for Endpoint, then enriches results with the users currently or recently
  logged on to those devices. This surfaces the specific users most at risk from unpatched,
  ransomware-enabling vulnerabilities and enables targeted notifications, priority patch scheduling,
  or enhanced monitoring based on user role.

  This query is optimized for Microsoft Defender Advanced Hunting. It embeds the 68 ransomware-
  associated KEV entries added from 2024-01-01 through 2026-01-29 as a KQL datatable, then joins
  against DeviceTvmSoftwareVulnerabilities and DeviceInfo. For older ransomware KEVs, use the
  companion query KEVRansomwareLinkedOver30Days-DefenderAH.yaml.

  Note: This datatable was generated from the CISA KEV catalog on 2026-03-01. Re-generate
  periodically. The snapshot covers 68 ransomware-associated CVEs from 2024+.

  Recommended Action: Notify affected users and their managers. Prioritize patching on devices
  belonging to privileged users. Consider enhanced behavioural monitoring on user accounts associated
  with devices that carry multiple ransomware-linked KEVs.
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceTvmSoftwareVulnerabilities
      - DeviceInfo
      - IdentityInfo
tactics:
  - InitialAccess
  - LateralMovement
  - Impact
relevantTechniques:
  - T1190
  - T1210
  - T1486
query: |
  // Ransomware-associated CISA KEV entries from 2024-01-01 through 2026-01-29 (68 entries)
  // Source: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  // Last updated: 2026-03-01 - re-generate periodically
  let RansomwareKEVs = datatable(
      CveID: string,
      DateAdded: datetime,
      VendorProject: string,
      Product: string,
      VulnerabilityName: string
  )[
      "CVE-2026-23760", datetime(2026-01-26), "SmarterTools", "SmarterMail", "SmarterTools SmarterMail Authentication Bypass Using an Alternate Path or Channe",
